<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#12161f;--sub:#5b6474;--line:#e3e7ee;--blue:#2f6bff;--blue-d:#1f55e0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171b24;--ink:#f1f3f7;--sub:#9aa3b2;--line:#262c38}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;-webkit-font-smoothing:antialiased}

.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:1px solid var(--line)}
.body{padding:28px 28px 30px}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--blue);margin:0 0 8px}
h1{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:700}
.meta{font-size:14px;color:var(--sub);margin:0 0 24px}
.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;padding:16px 18px;transition:background .15s}
.btn:hover{background:var(--blue-d)}
.btn:focus-visible,.sub a:focus-visible{outline:3px solid rgba(47,107,255,.45);outline-offset:2px}
.sub{font-size:14px;color:var(--sub);text-align:center;margin:16px 0 0}
.sub a{color:var(--blue);font-weight:600}
</style>
